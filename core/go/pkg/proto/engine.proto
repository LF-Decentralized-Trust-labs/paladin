syntax = "proto3";

package io.kaleido.paladin.kata.engine;
option go_package = "pkg/proto/engine";
import "to_domain.proto";
import "private_tx.proto";
import "states.proto";

message NonceAssigned {
    string id = 1;
    string contract_address = 2;
    string transaction_id = 3;
    int64 nonce = 4;
}

message TransactionSubmitted {
    string id = 1;
    string contract_address = 2;
    string transaction_id = 3;
    bytes hash = 4;
}

message TransactionDispatched {
    string id = 1;
    string contract_address = 2;
    string transaction_id = 3;
    bytes post_assemble_hash = 4;
    string signer = 5;
}

message TransactionConfirmed {
    enum Outcome {
        OUTCOME_UNSPECIFIED = 0;
        OUTCOME_SUCCESS = 1;
        OUTCOME_REVERTED = 2;
    }
    string id = 1;
    string contract_address = 2;
    string transaction_id = 3;
    int64 nonce = 4;
    Outcome outcome = 5;
    bool will_retry = 6;
    bytes revert_reason = 7;
    string failure_message = 8;
}

enum RejectionReason {
    BLOCK_HEIGHT_TOLERANCE = 0;         // sender and receiver block heights differ by more than the configured tolerance
    NOT_CURRENT_DELEGATE = 1;           // receiver does not recognise the sender as its current active coordinator/delegate
    TRANSACTION_UNKNOWN = 2;            // receiver does not recognise the transaction (likely already cleaned up)
    ENDORSER_IS_ACTIVE_COORDINATOR = 3; // endorser is currently the active coordinator and will not accept requests from a different coordinator
    PRIVATE_STATE_DATA_PENDING = 4;     // private state data for this contract is pending arrival at this node up to the assembly/endorsement low watermark
}

message EndorsementRequest {
    io.kaleido.paladin.toolkit.AttestationRequest attestation_request = 1;
    string idempotency_key = 2;
    string contract_address = 3;
    string party = 4;
    io.kaleido.paladin.toolkit.TransactionSpecification transaction_specification = 5;
    repeated io.kaleido.paladin.toolkit.ResolvedVerifier verifiers = 6;
    repeated io.kaleido.paladin.toolkit.AttestationResult signatures = 7;
    repeated io.kaleido.paladin.toolkit.EndorsableState inputStates = 8;
    repeated io.kaleido.paladin.toolkit.EndorsableState readStates = 9;
    repeated io.kaleido.paladin.toolkit.EndorsableState outputStates = 10;
    repeated io.kaleido.paladin.toolkit.EndorsableState infoStates = 11;
    int64 expiry_time_unix_ms = 12;
    int64 coordinator_block_height = 13;
    int64 block_height_tolerance = 14;
    io.kaleido.paladin.toolkit.BlockContext block_context = 15;
}

message EndorsementResponse {
    string transaction_id = 1;
    string idempotency_key = 2;
    string contract_address = 3;
    optional io.kaleido.paladin.toolkit.AttestationResult endorsement = 4;
    optional string revert_reason = 5;
    string party = 6;
    string attestation_request_name = 7;
}

message EndorsementRejection {
    string transaction_id = 1;
    string idempotency_key = 2;
    string contract_address = 3;
    string party = 4;
    string attestation_request_name = 5;
    RejectionReason rejection_reason = 6;
    int64 coordinator_block_height = 7;
    int64 endorser_block_height = 8;
    int64 block_height_tolerance = 9;   // the tolerance the coordinator was configured with, for diagnostic logging
}

message DelegationRequest {
    string delegate_node_id = 1;
    string delegation_id = 2; //this is used to correlate the acknowledgement back to the delegation. unlike the transport message id / correlation id, this is not unique across retries
    int64 originator_block_height = 3; // the originator's block height upon which this delegation was calculated
    repeated PrivateTransactionDelegation transactions = 4; // typed delegation descriptors, one per delegated transaction
    string contract_address = 5; // hex EthAddress — all transactions in this request share the same contract
}

// PrivateTransactionDelegation is the minimal wire descriptor sent when an originator
// delegates a transaction to a coordinator
message PrivateTransactionDelegation {
    string domain = 1;
    io.kaleido.paladin.toolkit.TransactionSpecification.Intent intent = 2;
    io.kaleido.paladin.toolkit.TransactionPreAssembly pre_assembly = 3;
}

message DelegationResponse {
    repeated string transaction_ids = 1;
    repeated int64 errors = 2; // Every delegate could have a different result. Allow optional enum error per transaction
    string delegate_node_id = 3;
    string delegation_id = 4; // this is used to correlate the acknowledgement back to the delegation. unlike the transport message id / correlation id, this is not unique across retries
    string contract_address = 5;
}

message DelegationRejection {
    string delegate_node_id = 1;
    string delegation_id = 2;           // correlates the rejection back to the delegation request
    string contract_address = 3;
    string active_coordinator = 4;      // the rejecting coordinator's belief of who is currently active, so the originator can fast-redirect
    RejectionReason rejection_reason = 5;
    int64 originator_block_height = 6;  // the originator's block height echoed from the request
    int64 coordinator_block_height = 7; // the coordinator's block height at the time of rejection
    int64 block_height_tolerance = 8;   // the tolerance the coordinator was configured with
}

message CoordinatorHandoverRequest {
    string contract_address = 1;
}

message AssembleRequest {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    int64 coordinator_block_height = 4;
    int64 expiry_time_unix_ms = 5;
    int64 block_height_tolerance = 6;
}

// QueryAvailableStatesRequest asks the coordinator to evaluate a state query against the snapshot
// view captured when the assemble request was sent, replying with the matching states
// including their data. request_id is unique per query and reused across retries of the same query.
// assemble_request_id identifies the assemble this query is part of, and routes it to the view
// captured for that assemble.
message QueryAvailableStatesRequest {
    string contract_address = 1;
    string request_id = 2;
    string schema_id = 3;
    string query_json = 4;
    string assemble_request_id = 5;
}

message QueryAvailableStatesResponse {
    string contract_address = 1;
    string request_id = 2;
    repeated io.kaleido.paladin.toolkit.QueriedState states = 3;
}

// GetSpentStateIDsRequest asks the coordinator for the IDs of every state the captured view
// already knows to be consumed ahead-of-chain, applied by the receiver as an exclusion set on its
// own DB queries. request_id is unique per request and reused across retries. assemble_request_id
// identifies the assemble this request is part of, and routes it to the view captured for that assemble.
message GetSpentStateIDsRequest {
    string contract_address = 1;
    string request_id = 2;
    string assemble_request_id = 3;
}

message GetSpentStateIDsResponse {
    string contract_address = 1;
    string request_id = 2;
    repeated bytes spent_state_ids = 3; // raw state IDs
}

// StateViewError is the error reply shared by both state view request kinds, correlated by
// request_id.
message StateViewError {
    string contract_address = 1;
    string request_id = 2;
    string error_message = 3;
}

message AssembleResponse {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    io.kaleido.paladin.toolkit.TransactionPostAssembly post_assembly = 4;
}

message AssembleError {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    string error_message = 4;
}

message EndorsementError {
    string transaction_id = 1;
    string idempotency_key = 2;
    string contract_address = 3;
    string error_message = 4;
    string party = 5;
    string attestation_request_name = 6;
}

message AssembleRejection {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    RejectionReason rejection_reason = 4;
    int64 coordinator_block_height = 5;
    int64 assembler_block_height = 6;
}

message SignResponse {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    io.kaleido.paladin.toolkit.AttestationResult attestation_result = 4;
    io.kaleido.paladin.toolkit.TransactionPostAssembly post_assembly = 5;
}

message SignError {
    string transaction_id = 1;
    string assemble_request_id = 2;
    string contract_address = 3;
    string error_message = 4;
}

message PreDispatchRequest {
    string id = 1;
    string transaction_id = 2;
    string contract_address = 3;
}

message PreDispatchResponse {
    string id = 1;
    string transaction_id = 2;
    string contract_address = 3;
}

message PreDispatchRejection {
    string transaction_id = 1;
    string request_id = 2;
    string contract_address = 3;
    RejectionReason rejection_reason = 4;
}

message CoordinatorHeartbeatNotification {
    string contract_address = 1; // Represent as hex address?
    CoordinatorSnapshot coordinator_snapshot = 2;
}

// The snapshot transaction types are flattened (no embedding) — each carries the transaction id plus
// the lifecycle-specific fields. Only information that is, or will eventually be, known on the base
// ledger is included (hash, nonce, signer, revert reason).
message SnapshotPooledTransaction {
    string id = 1;
}
message SnapshotDispatchedTransaction {
    string id = 1;
    string signer = 2;
    optional string latest_submission_hash = 3;
    optional uint64 nonce = 4;
}
message SnapshotConfirmedTransaction {
    string id = 1;
    string signer = 2;
    optional string latest_submission_hash = 3;
    optional uint64 nonce = 4;
    string hash = 5;
}
message SnapshotRevertedTransaction {
    string id = 1;
    string revert_reason = 2;
}

// CoordinatorSnapshot is the payload of a coordinator heartbeat. state_snapshot is only populated in
// Flush/Closing (handover) heartbeats. coordinator_state is the raw int value of the coordinator
// top-level state machine (common.CoordinatorState) — cast on each side rather than mirroring the enum.
message CoordinatorSnapshot {
    repeated SnapshotDispatchedTransaction dispatched_transactions = 1;
    repeated SnapshotPooledTransaction pooled_transactions = 2;
    repeated SnapshotConfirmedTransaction confirmed_transactions = 3;
    repeated SnapshotRevertedTransaction reverted_transactions = 4;
    int32 coordinator_state = 5;
    uint64 block_height = 6;
    repeated string endorser_candidates = 7;
    io.kaleido.paladin.toolkit.StateSnapshot state_snapshot = 8; // for coordinator handover only
}
